services:
  - type: web
    name: bangalore-pincode-explorer-api
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: POSTAL_API_BASE_URL
        value: https://api.postalpincode.in/pincode
